name: Senora CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-verify:
    name: Backend Build & PostgreSQL Schema Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: senora
          POSTGRES_PASSWORD: senora_password
          POSTGRES_DB: senora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache-dependency-path: apps/server/go.sum

      - name: Verify PostgreSQL Schema Migrations
        env:
          PGPASSWORD: senora_password
        run: |
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000001_init.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000002_security_and_media.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000003_polls_stories_scheduled.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000004_reads_invites_bots.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000005_message_reads.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000006_push_devices.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000007_master_bot_and_server_settings.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000008_banned_ips.sql
          psql -v ON_ERROR_STOP=1 -h localhost -U senora -d senora_test -f database/migrations/000009_media_shares.sql

      - name: Verify Backend Compilation
        working-directory: apps/server
        run: |
          go vet ./...
          go build -v ./cmd/server

  frontend-verify:
    name: Frontend Typecheck & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        working-directory: apps/web
        run: npm ci

      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build Production Assets
        working-directory: apps/web
        run: npm run build
